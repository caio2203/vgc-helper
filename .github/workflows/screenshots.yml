name: Screenshots

# Regenerates the README and docs images in docs/images from a throwaway local instance with
# demo data. Run it by hand after UI changes. With the GitHub App set up it opens a pull
# request; the images are always attached to the run as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @vgc-helper/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vgc-helper/web screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/images
          retention-days: 14

      - id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - if: vars.BOT_APP_ID != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: docs/screenshots
          delete-branch: true
          commit-message: "docs: regenerate screenshots"
          title: "docs: regenerate screenshots"
          body: Screenshots regenerated by the `Screenshots` workflow from a throwaway instance with demo data.
          add-paths: docs/images
